name: regression-suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("car","MASS","lmtest","sandwich","mice","leaps","mgcv","robustbase","boot","knitr","jsonlite","base64enc"))'
      - name: Run the regression suite (16 datasets, fast mode)
        run: Rscript scripts/rm_suite.R collaudi suite_out --esci-se-peggiora
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results
          path: |
            suite_out/confronto.csv
            suite_out/risultati.json
            suite_out/*.log
